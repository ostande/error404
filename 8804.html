<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>T'es en avance</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;900&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      overflow:hidden;
      font-family:'Poppins',sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#050816,#120024,#000);
      color:white;
      position:relative;
    }

    /* Background glow */
    .glow{
      position:absolute;
      width:450px;
      height:450px;
      border-radius:50%;
      filter:blur(140px);
      opacity:0.5;
      animation:float 8s infinite alternate ease-in-out;
    }

    .g1{
      background:#ff00ff;
      top:-120px;
      left:-120px;
    }

    .g2{
      background:#00d9ff;
      bottom:-120px;
      right:-120px;
      animation-delay:2s;
    }

    @keyframes float{
      from{
        transform:translate(0,0);
      }
      to{
        transform:translate(40px,30px);
      }
    }

    .container{
      position:relative;
      z-index:2;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.15);
      backdrop-filter:blur(18px);
      padding:60px;
      border-radius:35px;
      text-align:center;
      width:90%;
      max-width:850px;
      box-shadow:0 0 40px rgba(0,0,0,0.5);
      animation:fade 1s ease;
    }

    h1{
      font-size:3.5rem;
      font-weight:900;
      margin-bottom:15px;
      background:linear-gradient(90deg,#00d9ff,#ff00ff);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .subtitle{
      color:rgba(255,255,255,0.75);
      margin-bottom:50px;
      font-size:1.1rem;
    }

    .countdown{
      display:flex;
      justify-content:center;
      gap:25px;
      flex-wrap:wrap;
    }

    .box{
      width:150px;
      height:150px;
      border-radius:25px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.1);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      transition:0.3s;
    }

    .box:hover{
      transform:translateY(-8px) scale(1.03);
      box-shadow:0 0 25px rgba(255,255,255,0.12);
    }

    .number{
      font-size:3.5rem;
      font-weight:900;
    }

    .label{
      margin-top:10px;
      color:rgba(255,255,255,0.7);
      letter-spacing:1px;
      text-transform:uppercase;
      font-size:0.9rem;
    }

    .footer{
      margin-top:45px;
      color:rgba(255,255,255,0.5);
      font-size:0.9rem;
    }

    @keyframes fade{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @media(max-width:700px){
      .box{
        width:120px;
        height:120px;
      }

      .number{
        font-size:2.5rem;
      }

      h1{
        font-size:2.3rem;
      }
    }

  </style>
</head>
<body>

  <div class="glow g1"></div>
  <div class="glow g2"></div>

    <div class="countdown">

      <div class="box">
        <div class="number" id="days">00</div>
        <div class="label">Jours</div>
      </div>

      <div class="box">
        <div class="number" id="hours">00</div>
        <div class="label">Heures</div>
      </div>

      <div class="box">
        <div class="number" id="minutes">00</div>
        <div class="label">Minutes</div>
      </div>

      <div class="box">
        <div class="number" id="seconds">00</div>
        <div class="label">Secondes</div>
      </div>

    </div>

    <div class="footer">
      Ça arrive bientôt 👀
    </div>
  </div>

  <script>
    // Date cible : 27 mai à 16h00
    const targetDate = new Date("May 27, 2026 16:00:00").getTime();

    function updateCountdown(){

      const now = new Date().getTime();
      const diff = targetDate - now;

      if(diff <= 0){
        document.querySelector(".countdown").innerHTML = `
          <h2 style="font-size:3rem;">🔥 C'est le moment ! 🔥</h2>
        `;
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById("days").textContent = String(days).padStart(2,'0');
      document.getElementById("hours").textContent = String(hours).padStart(2,'0');
      document.getElementById("minutes").textContent = String(minutes).padStart(2,'0');
      document.getElementById("seconds").textContent = String(seconds).padStart(2,'0');
    }

    updateCountdown();
    setInterval(updateCountdown,1000);
  </script>

</body>
</html>
