<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Space Swipe — Avec images</title>
<style>
  :root{--bg:#040712;--ship:#7ee787;--bullet:#b8fff2;--ui:#e6eef6}
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;background:linear-gradient(180deg,#00111a,#040712);color:var(--ui);-webkit-tap-highlight-color:transparent}
  #wrap{max-width:720px;margin:0 auto;padding:12px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  h1{font-size:1rem;margin:0}
  .hud{font-size:0.95rem}
  canvas{width:100%;height:auto;border-radius:12px;background:linear-gradient(#001322,#00111a);touch-action:none;display:block}
  .controls{display:flex;gap:8px;justify-content:center;margin-top:8px}
  button{background:rgba(255,255,255,0.04);color:var(--ui);border:0;padding:8px 12px;border-radius:8px;font-size:14px}
  .small{font-size:13px;padding:6px 10px}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>Space Swipe</h1>
    <div class="hud">Score: <span id="score">0</span> — Vies: <span id="lives">3</span></div>
  </header>

  <canvas id="game" width="720" height="1280" aria-label="Jeu Space Swipe"></canvas>

  <div class="controls">
    <button id="start" class="small">Démarrer</button>
    <button id="pause" class="small">Pause</button>
    <button id="reset" class="small">Réinitialiser</button>
  </div>
</div>

<script>
/* Mobile-first shooter: meteors are rendered with an image.
   Put your image file (meteor.png) next to this HTML or change path.
*/
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const startBtn = document.getElementById('start');
const pauseBtn = document.getElementById('pause');
const resetBtn = document.getElementById('reset');

let W = canvas.width, H = canvas.height;
let running = false, paused = false;
let score = 0, lives = 3;
let lastSpawn = 0, spawnInterval = 900;
let objs = [], bullets = [];
let lastShot = 0, shotCooldown = 220;
let touchId = null, touchX = null;
const ship = { x: W/2, y: H - 160, r: 28, speed: 0.35 };

// --- Image loading ---
const meteorImg = new Image();
meteorImg.src = 'meteor.png'; // <-- change path if needed
let meteorReady = false;
meteorImg.onload = ()=> meteorReady = true;
meteorImg.onerror = ()=> { meteorReady = false; console.warn('meteor image failed to load — fallback circle will be used.'); };

// resize for display (DPR)
function resizeForDisplay(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.style.height = Math.min(window.innerHeight - 140, 900) + 'px';
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resizeForDisplay();
window.addEventListener('resize', resizeForDisplay);

function spawnMeteor(){
  const size = 24 + Math.random()*46;
  const x = Math.random()*(W - size) + size/2;
  const speed = 0.9 + Math.random()*1.8 + score*0.002;
  const rot = (Math.random()-0.5)*0.04;
  objs.push({ x, y: -size, r: size/2, size, speed, rot, ang: Math.random()*Math.PI*2, hits: 0 });
}

function update(dt){
  if(paused) return;
  lastSpawn += dt;
  if(lastSpawn > spawnInterval){
    lastSpawn = 0;
    spawnMeteor();
    if(Math.random() < 0.06) spawnInterval = Math.max(420, spawnInterval * 0.96);
  }

  if(touchX !== null){
    const dx = touchX - ship.x;
    ship.x += dx * Math.min(1, ship.speed * dt * 0.06);
    ship.x = Math.max(ship.r, Math.min(W - ship.r, ship.x));
  }

  for(let i = objs.length-1; i>=0; i--){
    const o = objs[i];
    o.y += o.speed * dt * 0.06;
    o.ang += o.rot * dt * 0.06;
    const dx = o.x - ship.x, dy = o.y - ship.y;
    if(Math.hypot(dx,dy) < o.r + ship.r - 6){
      objs.splice(i,1);
      lives -= 1;
      continue;
    }
    if(o.y - o.r > H + 40) objs.splice(i,1);
  }

  for(let i = bullets.length-1; i>=0; i--){
    const b = bullets[i];
    b.y -= b.speed * dt * 0.06;
    if(b.y < -20){ bullets.splice(i,1); continue; }
    for(let j = objs.length-1; j>=0; j--){
      const o = objs[j];
      const dx = o.x - b.x, dy = o.y - b.y;
      if(Math.hypot(dx,dy) < o.r + 4){
        bullets.splice(i,1);
        o.hits++;
        const destroyed = o.r < 32 || o.hits > 1;
        if(destroyed){
          score += Math.round(10 + o.r);
          objs.splice(j,1);
        }
        break;
      }
    }
  }

  lastShot += dt;
  if(touchX !== null && lastShot > shotCooldown){
    lastShot = 0;
    fireBullet();
  }

  scoreEl.textContent = score;
  livesEl.textContent = lives;
  if(lives <= 0){ running = false; paused = true; showGameOver(); }
}

function fireBullet(){
  bullets.push({ x: ship.x, y: ship.y - ship.r - 6, r:4, speed: 10 + Math.random()*2 });
}

function drawShip(x,y,r){
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ship') || '#7ee787';
  ctx.beginPath();
  ctx.moveTo(0,-r);
  ctx.lineTo(r*0.6, r*0.9);
  ctx.lineTo(-r*0.6, r*0.9);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#052';
  ctx.beginPath();
  ctx.ellipse(0, -r*0.12, r*0.28, r*0.18, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function draw(){
  ctx.fillStyle = 'black';
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = '#071a26';
  for(let i=0;i<60;i++){
    const sx = (i*97)%W, sy = ((i*53)+Math.floor(score/50*7))%H;
    ctx.fillRect(sx, sy, 1,1);
  }

  // meteors: use image if ready, otherwise fallback to circle
  for(const o of objs){
    ctx.save();
    ctx.translate(o.x,o.y);
    ctx.rotate(o.ang);
    if(meteorReady){
      // draw image centered, scale to object's size
      const dw = o.size, dh = o.size;
      ctx.drawImage(meteorImg, -dw/2, -dh/2, dw, dh);
    } else {
      // fallback: textured circle
      const grad = ctx.createLinearGradient(-o.r,-o.r,o.r,o.r);
      grad.addColorStop(0,'#fff2d8');
      grad.addColorStop(0.5,'#ffb77a');
      grad.addColorStop(1,'#ff9b71');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0,0,o.r,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bullet') || '#b8fff2';
  for(const b of bullets){
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fill();
  }

  drawShip(ship.x, ship.y, ship.r);

  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = '18px system-ui, -apple-system, Arial';
  ctx.textAlign = 'left';
  ctx.fillText('Score: ' + score, 12, 28);
  ctx.textAlign = 'right';
  ctx.fillText('Lives: ' + lives, W - 12, 28);
}

function showGameOver(){
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.font = '40px system-ui, -apple-system, Arial';
  ctx.fillText('Game Over', W/2, H/2 - 10);
  ctx.font = '18px system-ui, -apple-system, Arial';
  ctx.fillText('Appuyez sur Démarrer pour rejouer', W/2, H/2 + 26);
}

let lastTime = 0;
function loop(ts){
  if(!running){ if(paused) return; }
  const dt = ts - lastTime || 16;
  lastTime = ts;
  update(dt);
  draw();
  if(running || !paused) requestAnimationFrame(loop);
}

function getCanvasPos(clientX){
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  return (clientX - rect.left) * scaleX;
}
