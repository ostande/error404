<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Meteor Escape</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        touch-action:none;
        user-select:none;
    }

    body{
        overflow:hidden;
        background:black;
        font-family:Arial, sans-serif;
    }

    canvas{
        display:block;
        background:
            radial-gradient(circle at center, #111 0%, #000 100%);
    }

    #ui{
        position:absolute;
        top:0;
        left:0;
        width:100%;
        padding:15px;
        color:white;
        z-index:10;
        display:flex;
        justify-content:space-between;
        font-size:20px;
        font-weight:bold;
        text-shadow:0 0 10px #00ffff;
    }

    #startScreen,
    #levelMessage,
    #finalMessage{
        position:absolute;
        inset:0;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        background:rgba(0,0,0,0.85);
        color:white;
        z-index:20;
        text-align:center;
        padding:20px;
    }

    button{
        margin-top:20px;
        padding:15px 30px;
        font-size:20px;
        border:none;
        border-radius:12px;
        background:#00ffff;
        color:black;
        font-weight:bold;
    }

    h1{
        font-size:42px;
        margin-bottom:20px;
        text-shadow:0 0 15px cyan;
    }

    #levelMessage,
    #finalMessage{
        display:none;
    }

    .pulse{
        animation:pulse 1s infinite;
    }

    @keyframes pulse{
        0%{transform:scale(1);}
        50%{transform:scale(1.08);}
        100%{transform:scale(1);}
    }
</style>
</head>
<body>

<div id="ui">
    <div>Niveau : <span id="level">1</span></div>
    <div>Score : <span id="score">0</span></div>
</div>

<div id="startScreen">
    <h1>METEOR ESCAPE</h1>
    <p>Évite les météores le plus longtemps possible.</p>
    <button id="startBtn">JOUER</button>
</div>

<div id="levelMessage">
    <h1 class="pulse">NIVEAU SUIVANT</h1>
</div>

<div id="finalMessage">
    <h1>MESSAGE SECRET</h1>
    <p>
        REMPLACE CE TEXTE PAR TON MESSAGE AU NIVEAU 10
    </p>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;

window.addEventListener("resize", () => {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
});

const meteorImg = new Image();
meteorImg.src = "meteor.gif";

const player = {
    x: w / 2,
    y: h - 120,
    size: 35,
    speed: 0.2
};

let meteors = [];
let score = 0;
let level = 1;
let gameRunning = false;
let spawnRate = 1200;
let meteorSpeed = 3;

const scoreEl = document.getElementById("score");
const levelEl = document.getElementById("level");

function vibrate(ms){
    if(navigator.vibrate){
        navigator.vibrate(ms);
    }
}

function playBeep(freq, duration){
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.frequency.value = freq;
    osc.type = "square";

    osc.start();

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioCtx.currentTime + duration / 1000
    );

    osc.stop(audioCtx.currentTime + duration / 1000);
}

function createMeteor(){
    const size = Math.random() * 50 + 40;

    meteors.push({
        x: Math.random() * (w - size),
        y: -size,
        size,
        speed: meteorSpeed + Math.random() * 2,
        rotation: Math.random() * Math.PI
    });
}

function updateLevel(){
    const newLevel = Math.min(10, Math.floor(score / 15) + 1);

    if(newLevel !== level){
        level = newLevel;
        levelEl.innerText = level;

        spawnRate = Math.max(250, spawnRate - 80);
        meteorSpeed += 0.5;

        showLevelMessage();

        playBeep(500, 200);
        vibrate(120);

        if(level === 10){
            endGameFinal();
        }
    }
}

function showLevelMessage(){
    const el = document.getElementById("levelMessage");

    el.style.display = "flex";

    setTimeout(() => {
        el.style.display = "none";
    }, 1200);
}

function endGame(){
    gameRunning = false;

    playBeep(120, 700);
    vibrate([100, 50, 100, 50, 300]);

    setTimeout(() => {
        alert("Game Over\nScore : " + score);
        location.reload();
    }, 300);
}

function endGameFinal(){
    gameRunning = false;

    playBeep(900, 1200);
    vibrate([200,100,200,100,500]);

    document.getElementById("finalMessage").style.display = "flex";
}

function collision(a, b){
    const dx = a.x - b.x;
    const dy = a.y - b.y;
    const distance = Math.sqrt(dx * dx + dy * dy);

    return distance < a.size/2 + b.size/2;
}

function drawPlayer(){
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
    ctx.fillStyle = "#00ffff";
    ctx.shadowBlur = 20;
    ctx.shadowColor = "#00ffff";
    ctx.fill();
}

function drawMeteors(){
    meteors.forEach(m => {

        ctx.save();

        ctx.translate(m.x + m.size/2, m.y + m.size/2);
        ctx.rotate(m.rotation);

        ctx.drawImage(
            meteorImg,
            -m.size/2,
            -m.size/2,
            m.size,
            m.size
        );

        ctx.restore();

        m.y += m.speed;
        m.rotation += 0.02;

        if(m.y > h + 100){
            score++;
            scoreEl.innerText = score;
        }
    });

    meteors = meteors.filter(m => m.y < h + 100);
}

function gameLoop(){
    if(!gameRunning) return;

    ctx.clearRect(0,0,w,h);

    drawPlayer();
    drawMeteors();

    meteors.forEach(m => {
        if(collision(
            {
                x:player.x,
                y:player.y,
                size:player.size*2
            },
            {
                x:m.x + m.size/2,
                y:m.y + m.size/2,
                size:m.size
            }
        )){
            endGame();
        }
    });

    updateLevel();

    requestAnimationFrame(gameLoop);
}

let spawnInterval;

function startGame(){

    document.getElementById("startScreen").style.display = "none";

    gameRunning = true;

    spawnInterval = setInterval(() => {
        createMeteor();
    }, spawnRate);

    setInterval(() => {
        clearInterval(spawnInterval);

        spawnInterval = setInterval(() => {
            createMeteor();
        }, spawnRate);

    }, 3000);

    gameLoop();
}

canvas.addEventListener("touchmove", e => {
    const touch = e.touches[0];

    player.x += (touch.clientX - player.x) * player.speed;

    if(player.x < player.size){
        player.x = player.size;
    }

    if(player.x > w - player.size){
        player.x = w - player.size;
    }
});

canvas.addEventListener("mousemove", e => {

    player.x += (e.clientX - player.x) * player.speed;

});

document.getElementById("startBtn").addEventListener("click", () => {

    playBeep(700, 150);

    startGame();
});
</script>

</body>
</html>
