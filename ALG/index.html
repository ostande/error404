```html
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Panda Carbs 🐼</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f1e8;
      font-family: Arial, sans-serif;
      color: #222;
      text-align: center;
    }

    .game {
      width: 100%;
      max-width: 500px;
      padding: 25px;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 42px;
    }

    .subtitle {
      margin-bottom: 25px;
      color: #666;
    }

    .panda {
      font-size: 130px;
      line-height: 1;
      margin: 20px 0;
      transition: transform 0.15s;
      user-select: none;
    }

    .panda.eat {
      transform: scale(1.12) rotate(-3deg);
    }

    .panda.full {
      animation: shake 0.5s infinite alternate;
    }

    @keyframes shake {
      from {
        transform: rotate(-4deg) scale(1.15);
      }
      to {
        transform: rotate(4deg) scale(1.2);
      }
    }

    .message {
      min-height: 30px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .bar {
      width: 100%;
      height: 30px;
      background: #ddd;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .bar-fill {
      width: 0%;
      height: 100%;
      background: #222;
      transition: width 0.15s;
    }

    .score {
      font-size: 20px;
      margin-bottom: 20px;
    }

    button {
      border: none;
      border-radius: 15px;
      padding: 18px 25px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      background: #222;
      color: white;
      width: 100%;
      transition: transform 0.1s;
    }

    button:hover {
      transform: scale(1.02);
    }

    button:active {
      transform: scale(0.97);
    }

    .game-over {
      display: none;
    }

    .game-over h2 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .final-score {
      font-size: 22px;
      margin-bottom: 20px;
    }

    .video {
      margin: 20px 0;
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #ddd;
      border-radius: 12px;
      overflow: hidden;
    }

    .video iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .small {
      font-size: 13px;
      color: #888;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <main class="game">

    <!-- JEU -->
    <section id="game">

      <h1>🐼 Panda Carbs</h1>
      <div class="subtitle">Donne-lui des carbs.</div>

      <div id="panda" class="panda">🐼</div>

      <div id="message" class="message">
        Le panda a faim...
      </div>

      <div class="bar">
        <div id="barFill" class="bar-fill"></div>
      </div>

      <div class="score">
        🍝 <span id="score">0</span> carbs
      </div>

      <button id="eatButton">
        🍝 DONNER DES CARBS
      </button>

    </section>


    <!-- FIN DU JEU -->
    <section id="gameOver" class="game-over">

      <div class="panda full">🐼</div>

      <h2>C'EST FINI. 💀</h2>

      <p>
        Tu as donné beaucoup trop de carbs au panda.
      </p>

      <div class="final-score">
        🍝 <strong><span id="finalScore">0</span> carbs</strong>
      </div>

      <!--
        REMPLACE YOUTUBE_VIDEO_ID PAR L'ID DE TA VIDÉO.

        Exemple :
        https://www.youtube.com/watch?v=dQw4w9WgXcQ

        devient :
        https://www.youtube.com/embed/dQw4w9WgXcQ
      -->
      <div class="video">
        <iframe
          src="https://www.youtube.com/watch?v=XHvtIcaD194&forced"
          title="Vidéo de fin"
          allowfullscreen>
        </iframe>
      </div>

      <button id="restartButton">
        🔄 REJOUER
      </button>

      <div class="small">
        Le panda avait été prévenu.
      </div>

    </section>

  </main>


  <script>
    let carbs = 0;
    const maxCarbs = 100;

    const panda = document.getElementById("panda");
    const barFill = document.getElementById("barFill");
    const score = document.getElementById("score");
    const message = document.getElementById("message");

    const game = document.getElementById("game");
    const gameOver = document.getElementById("gameOver");
    const finalScore = document.getElementById("finalScore");

    const eatButton = document.getElementById("eatButton");
    const restartButton = document.getElementById("restartButton");


    function eatCarbs() {

      if (carbs >= maxCarbs) return;

      carbs += 5;

      if (carbs > maxCarbs) {
        carbs = maxCarbs;
      }

      score.textContent = carbs;
      barFill.style.width = carbs + "%";

      // Petite animation
      panda.classList.remove("eat");
      void panda.offsetWidth;
      panda.classList.add("eat");

      // Messages
      if (carbs < 30) {
        message.textContent = "Miam... encore des carbs !";
      } else if (carbs < 60) {
        message.textContent = "Le panda commence à être plein...";
      } else if (carbs < 80) {
        message.textContent = "Vraiment sûr que tu veux continuer ?";
      } else if (carbs < 100) {
        message.textContent = "LE PANDA N'EN PEUT PLUS 😭";
      }

      // Game over
      if (carbs >= maxCarbs) {
        setTimeout(endGame, 300);
      }
    }


    function endGame() {

      finalScore.textContent = carbs;

      game.style.display = "none";
      gameOver.style.display = "block";
    }


    function restartGame() {

      carbs = 0;

      score.textContent = "0";
      barFill.style.width = "0%";
      message.textContent = "Le panda a faim...";

      gameOver.style.display = "none";
      game.style.display = "block";

      panda.classList.remove("eat");
    }


    eatButton.addEventListener("click", eatCarbs);
    restartButton.addEventListener("click", restartGame);


    // ESPACE = donner des carbs
    document.addEventListener("keydown", function(event) {

      if (event.code === "Space" && game.style.display !== "none") {
        event.preventDefault();
        eatCarbs();
      }

    });
  </script>

</body>
</html>
