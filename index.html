<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meteor Escape</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    touch-action:none;
}

body{
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    background:radial-gradient(circle at center,#111 0%,#000 100%);
}

#ui{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    padding:15px;
    display:flex;
    justify-content:space-between;
    color:white;
    font-size:20px;
    font-weight:bold;
    z-index:10;
    text-shadow:0 0 10px cyan;
}

#startScreen,
#gameOverScreen,
#finalScreen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:rgba(0,0,0,.88);
    color:white;
    z-index:20;
    padding:20px;
}

#gameOverScreen,
#finalScreen{
    display:none;
}

h1{
    font-size:48px;
    margin-bottom:20px;
    text-shadow:0 0 15px cyan;
}

p{
    font-size:20px;
    margin-bottom:20px;
}

button{
    padding:15px 35px;
    font-size:20px;
    font-weight:bold;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:cyan;
    color:black;
}

#levelMessage{
    position:absolute;
    top:80px;
    right:15px;
    display:none;
    padding:10px 15px;
    border-radius:20px;
    background:rgba(0,255,255,.15);
    border:1px solid rgba(0,255,255,.6);
    color:cyan;
    z-index:30;
    font-weight:bold;
    backdrop-filter:blur(4px);
}

.fade{
    animation:fadeLevel 1.3s forwards;
}

@keyframes fadeLevel{
    0%{
        opacity:0;
        transform:translateY(-10px);
    }
    15%{
        opacity:1;
        transform:translateY(0);
    }
    80%{
        opacity:1;
    }
    100%{
        opacity:0;
    }
}
</style>
</head>
<body>

<div id="ui">
    <div>Niveau : <span id="level">1</span></div>
    <div>Score : <span id="score">0</span></div>
</div>

<div id="startScreen">
    <h1>METEOR ESCAPE</h1>
    <p>Survis jusqu'au niveau 10.</p>
    <button id="startBtn">JOUER</button>
</div>

<div id="gameOverScreen">
    <h1>GAME OVER</h1>
    <p id="finalScore"></p>
    <button onclick="location.reload()">REJOUER</button>
</div>

<div id="finalScreen">
    <h1>MESSAGE SECRET</h1>
    <p>Ce site est actuellement en construction.<br>Merci de ta compréhension 🚀</p>
    <button onclick="location.reload()">RECOMMENCER</button>
</div>

<div id="levelMessage"></div>

<canvas id="game"></canvas>

<!-- Ajoute ton fichier -->
<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;

window.addEventListener("resize",()=>{
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
});

const meteorImg = new Image();
meteorImg.src = "meteor.gif"; // ajoute ton image

const music = document.getElementById("bgMusic");
music.volume = 0.4;

const audioCtx = new(window.AudioContext||window.webkitAudioContext)();

function beep(freq,duration){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.frequency.value = freq;
    osc.type = "square";

    gain.gain.value = 0.08;

    osc.start();

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioCtx.currentTime + duration/1000
    );

    osc.stop(audioCtx.currentTime + duration/1000);
}

function vibrate(ms){
    if(navigator.vibrate){
        navigator.vibrate(ms);
    }
}

const player={
    x:w/2,
    y:h-120,
    size:35,
    speed:0.25
};

let meteors=[];
let particles=[];

let score=0;
let level=1;

let meteorSpeed=3;
let meteorCount=1;
let spawnRate=1200;

let gameRunning=false;
let spawnInterval=null;
let difficultyInterval=null;

const scoreEl=document.getElementById("score");
const levelEl=document.getElementById("level");

function createExplosion(x,y){

    for(let i=0;i<25;i++){

        particles.push({
            x,
            y,
            vx:(Math.random()-0.5)*8,
            vy:(Math.random()-0.5)*8,
            size:Math.random()*5+2,
            life:60
        });
    }
}

function createMeteor(){

    for(let i=0;i<meteorCount;i++){

        const size=Math.random()*50+40;

        meteors.push({
            x:Math.random()*(w-size),
            y:-size,
            size,
            speed:meteorSpeed+Math.random()*3,
            drift:(Math.random()-0.5)*2,
            rotation:Math.random()*Math.PI
        });
    }
}

function drawStars(){

    for(let i=0;i<50;i++){

        ctx.fillStyle="rgba(255,255,255,.15)";

        ctx.fillRect(
            (i*97 + performance.now()*0.03)%w,
            (i*53)%h,
            2,
            2
        );
    }
}

function drawPlayer(){

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        player.size,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#00ffff";
    ctx.shadowBlur=20;
    ctx.shadowColor="#00ffff";
    ctx.fill();
    ctx.shadowBlur=0;
}

function drawParticles(){

    particles.forEach(p=>{

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fillStyle=`rgba(0,255,255,${p.life/60})`;
        ctx.fill();

        p.x+=p.vx;
        p.y+=p.vy;
        p.life--;
    });

    particles=particles.filter(p=>p.life>0);
}

function drawMeteors(){

    meteors.forEach(m=>{

        ctx.save();

        ctx.translate(
            m.x+m.size/2,
            m.y+m.size/2
        );

        ctx.rotate(m.rotation);

        if(meteorImg.complete){

            ctx.drawImage(
                meteorImg,
                -m.size/2,
                -m.size/2,
                m.size,
                m.size
            );

        }else{

            ctx.beginPath();
            ctx.arc(0,0,m.size/2,0,Math.PI*2);
            ctx.fillStyle="orange";
            ctx.fill();
        }

        ctx.restore();

        m.y+=m.speed;
        m.x+=m.drift;
        m.rotation+=0.03;

        if(m.x<0 || m.x>w-m.size){
            m.drift*=-1;
        }

        if(m.y>h+100){
            score++;
            scoreEl.textContent=score;
        }
    });

    meteors=meteors.filter(m=>m.y<h+100);
}

function collision(a,b){

    const dx=a.x-b.x;
    const dy=a.y-b.y;

    return Math.sqrt(dx*dx+dy*dy)
        < a.r+b.r;
}

function updateLevel(){

    const newLevel=Math.min(
        10,
        Math.floor(score/12)+1
    );

    if(newLevel===level) return;

    level=newLevel;
    levelEl.textContent=level;

    meteorSpeed+=1;
    spawnRate=Math.max(250,spawnRate-120);

    if(level>=4) meteorCount=2;
    if(level>=7) meteorCount=3;
    if(level>=9) meteorCount=4;

    showLevelMessage(level);

    createExplosion(w/2,h/2);

    beep(600,180);
    vibrate(100);

    restartSpawner();

    if(level===10){
        winGame();
    }
}

function showLevelMessage(level){

    const msg=document.getElementById("levelMessage");

    msg.textContent=`🚀 Niveau ${level}`;

    msg.classList.remove("fade");
    void msg.offsetWidth;

    msg.style.display="block";
    msg.classList.add("fade");

    setTimeout(()=>{
        msg.style.display="none";
    },1300);
}

function restartSpawner(){

    clearInterval(spawnInterval);

    spawnInterval=setInterval(()=>{
        createMeteor();
    },spawnRate);
}

function gameOver(){

    if(!gameRunning) return;

    gameRunning=false;

    clearInterval(spawnInterval);
    clearInterval(difficultyInterval);

    createExplosion(player.x,player.y);

    beep(150,700);

    document.getElementById(
        "finalScore"
    ).textContent=`Score : ${score}`;

    setTimeout(()=>{
        document.getElementById(
            "gameOverScreen"
        ).style.display="flex";
    },600);
}

function winGame(){

    gameRunning=false;

    clearInterval(spawnInterval);
    clearInterval(difficultyInterval);

    beep(1000,1000);

    document.getElementById(
        "finalScreen"
    ).style.display="flex";
}

function gameLoop(){

    if(!gameRunning) return;

    ctx.clearRect(0,0,w,h);

    drawStars();
    drawParticles();
    drawPlayer();
    drawMeteors();

    meteors.forEach(m=>{

        if(collision(
            {
                x:player.x,
                y:player.y,
                r:player.size
            },
            {
                x:m.x+m.size/2,
                y:m.y+m.size/2,
                r:m.size/2
            }
        )){
            gameOver();
        }
    });

    updateLevel();

    requestAnimationFrame(gameLoop);
}

function startGame(){

    if(gameRunning) return;

    gameRunning=true;

    document.getElementById(
        "startScreen"
    ).style.display="none";

    music.play().catch(()=>{});

    restartSpawner();

    difficultyInterval=setInterval(()=>{
        restartSpawner();
    },3000);

    gameLoop();
}

canvas.addEventListener("mousemove",(e)=>{

    player.x +=
        (e.clientX-player.x)
        *player.speed;

    if(player.x<player.size)
        player.x=player.size;

    if(player.x>w-player.size)
        player.x=w-player.size;
});

canvas.addEventListener("touchmove",(e)=>{

    const touch=e.touches[0];

    player.x +=
        (touch.clientX-player.x)
        *player.speed;

    if(player.x<player.size)
        player.x=player.size;

    if(player.x>w-player.size)
        player.x=w-player.size;
});

document
.getElementById("startBtn")
.addEventListener("click",()=>{

    if(audioCtx.state==="suspended"){
        audioCtx.resume();
    }

    beep(700,150);

    startGame();
});
</script>

</body>
</html>
