<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>site en construction</title>
<style>
  :root{
    --bg:#082032; --panel:#0b3446; --accent:#ffd166; --muted:#9fb3c8; --glass: rgba(255,255,255,0.04);
    --mobile-padding:16px;
  }
  *{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;}
  html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg) 0%, #053145 100%);color:#eaf6ff;}
  .app{min-height:100vh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) var(--mobile-padding) env(safe-area-inset-bottom);gap:12px;}
  header{display:flex;align-items:center;gap:12px;}
  .logo{width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,#0fb9b1,#4fd1c5);display:flex;align-items:center;justify-content:center;font-weight:700;color:#052a2a}
  h1{font-size:18px;margin:0}
  p.lead{margin:0;color:var(--muted);font-size:13px}

  main{display:grid;grid-template-columns:1fr;gap:12px;margin-top:6px;}
  .panel{background:linear-gradient(180deg,var(--panel), rgba(11,52,70,0.9));border-radius:14px;padding:12px;box-shadow:0 6px 18px rgba(0,0,0,0.35);}

  /* controls area */
  .controls{display:flex;gap:8px;flex-wrap:wrap;}
  .control{flex:1 1 140px;min-width:120px;background:var(--glass);padding:10px;border-radius:10px;}
  .control label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}
  .range{width:100%}
  .value{font-weight:700;color:var(--accent);font-size:18px;text-align:right}

  /* info row */
  .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .metric{flex:1;background:rgba(255,255,255,0.03);padding:10px;border-radius:10px;text-align:center}
  .metric .num{font-size:20px;font-weight:700;color:var(--accent)}
  .metric .label{font-size:12px;color:var(--muted);margin-top:6px}

  /* canvas */
  .sim-wrap{position:relative;padding:10px}
  canvas{width:100%;height:260px;border-radius:10px;background:linear-gradient(180deg,#062f3b 0%, #033244 100%);display:block}

  /* bottom actions */
  .actions{display:flex;gap:8px}
  button{flex:1;background:#ffd166;border:0;padding:10px;border-radius:10px;font-weight:700;color:#04231e}
  button.ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted)}
  small.note{display:block;text-align:center;color:var(--muted);margin-top:6px;font-size:12px}

  /* responsive tweaks for desktop */
  @media(min-width:760px){
    .app{max-width:920px;margin:18px auto}
    main{grid-template-columns:1fr 360px;}
    canvas{height:420px}
    .controls{flex-direction:column}
  }
</style>
</head>
<body>
<div class="app" role="application" aria-label="Réglage de voile">
  <header>
    <div class="logo">V</div>
    <div>
      <h1>Réglage de voile</h1>
      <p class="lead">Atteins la vitesse maximale en réglant foc & grand-voile</p>
    </div>
  </header>

  <main>
    <section class="panel sim-wrap" aria-label="Simulation">
      <canvas id="sea" width="800" height="420" aria-hidden="false"></canvas>
      <div style="margin-top:10px" class="row">
        <div class="metric">
          <div class="num" id="speed">0.0 kn</div>
          <div class="label">Vitesse</div>
        </div>
        <div class="metric">
          <div class="num" id="trueWind">° 0</div>
          <div class="label">Angle vent</div>
        </div>
        <div class="metric">
          <div class="num" id="target">0.0 kn</div>
          <div class="label">Vitesse max théorique</div>
        </div>
      </div>
    </section>

    <aside class="panel" aria-label="Contrôles">
      <div class="controls">
        <div class="control">
          <label for="mainTrim">Grand-voile (trim)</label>
          <input id="mainTrim" class="range" type="range" min="0" max="100" value="50" />
          <div class="value" id="mainVal">50</div>
        </div>
        <div class="control">
          <label for="jibTrim">Foc (trim)</label>
          <input id="jibTrim" class="range" type="range" min="0" max="100" value="50" />
          <div class="value" id="jibVal">50</div>
        </div>
        <div class="control">
          <label for="helm">Angle barre (°)</label>
          <input id="helm" class="range" type="range" min="-45" max="45" value="0" />
          <div class="value" id="helmVal">0°</div>
        </div>
        <div class="control">
          <label for="wind">Force du vent (nœuds)</label>
          <input id="wind" class="range" type="range" min="0" max="30" value="12" />
          <div class="value" id="windVal">12 kn</div>
        </div>
        <div style="flex-basis:100%;display:flex;gap:8px;margin-top:6px">
          <button id="start">Lancer</button>
          <button id="reset" class="ghost">Réinitialiser</button>
        </div>
      </div>

      <small class="note">Optimise l'angle entre voile & vent pour atteindre la vitesse max. Glisse les sliders.</small>
    </aside>
  </main>
</div>

<script>
/* Simple sail trim simulator optimized for mobile (touch events native via range inputs)
   Concepts:
   - boatSpeed depends on windSpeed * sailEfficiency * headingFactor
   - sailEfficiency depends on combined trim (main+jib) and angle-of-attack between sail and apparent wind
   - headingFactor penalizes close-hauled (very upwind) and downwind poorly trimmed situations
*/

const $ = id => document.getElementById(id);
const canvas = $('sea');
const ctx = canvas.getContext('2d');

let state = {
  running: false,
  windSpeed: 12,
  trueWindAngle: 60, // relative to boat heading; 0 = headwind, 90 = beam reach
  mainTrim: 50,
  jibTrim: 50,
  helm: 0,
  boatSpeed: 0,
  targetSpeed: 0
};

const toDisplay = n => (Math.round(n*10)/10).toFixed(1);

// UI bindings
['main','jib','helm','wind'].forEach(k=>{
  const el = $(k === 'main' ? 'mainTrim' : k==='jib' ? 'jibTrim' : k==='helm' ? 'helm' : 'wind');
  const disp = $(k === 'main' ? 'mainVal' : k==='jib' ? 'jibVal' : k==='helm' ? 'helmVal' : 'windVal');
  el.addEventListener('input', e=>{
    const v = Number(e.target.value);
    if(k==='main') state.mainTrim = v, disp.textContent = v;
    if(k==='jib') state.jibTrim = v, disp.textContent = v;
    if(k==='helm') state.helm = v, disp.textContent = v + '°';
    if(k==='wind') state.windSpeed = v, disp.textContent = v + ' kn';
    compute();
  });
});

// start/reset
$('start').addEventListener('click', ()=>{
  state.running = !state.running;
  $('start').textContent = state.running ? 'Pause' : 'Lancer';
});
$('reset').addEventListener('click', ()=>{
  state = {...state, running:false, windSpeed:12, trueWindAngle:60, mainTrim:50, jibTrim:50, helm:0, boatSpeed:0};
  $('start').textContent='Lancer';
  $('mainTrim').value='50';$('jibTrim').value='50';$('helm').value='0';$('wind').value='12';
  $('mainVal').textContent='50';$('jibVal').textContent='50';$('helmVal').textContent='0°';$('windVal').textContent='12 kn';
  compute(); draw();
});

// core physics-ish model (simple, empirical)
function compute(){
  const w = state.windSpeed;
  const main = state.mainTrim/100;
  const jib = state.jibTrim/100;

  // apparent wind angle approx = trueWindAngle - helm * small factor
  const awa = clamp(state.trueWindAngle - state.helm*0.6, 0, 180); // degrees

  // sail optimal trim depends on AWA: near beam reach (50-120) allow fuller trim; upwind needs flatter
  const optimalMain = clamp(map(awa, 0, 180, 30, 70), 0, 1); // 30-70%
  const optimalJib  = clamp(map(awa, 0, 180, 25, 65), 0, 1);

  // trim efficiency (1 = perfect)
  const effMain = Math.exp(-Math.abs(main - optimalMain));
  const effJib  = Math.exp(-Math.abs(jib - optimalJib));

  // heading factor: best around 80-100 degrees (beam to broad reach)
  const headingFactor = Math.max(0.2, 1 - Math.pow((awa - 90)/90, 2));

  // interaction: combined sail power
  const sailPower = (0.6*effMain + 0.4*effJib) * (main*0.8 + jib*0.6);

  // target speed (knots): proportional to sqrt of wind * sailPower * heading
  const target = Math.max(0, Math.sqrt(Math.max(0.1,w)) * sailPower * 2.2 * headingFactor);

  // small damping/smooth
  state.targetSpeed = target;
  state.boatSpeed += (state.targetSpeed - state.boatSpeed) * 0.08;
  updateUI(awa);
}

// helpers
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function map(v,a,b,ra,rb){return ra + (rb-ra)*( (v-a)/(b-a) );}

// UI updates
function updateUI(awa){
  $('speed').textContent = toDisplay(state.boatSpeed) + ' kn';
  $('trueWind').textContent = '° ' + Math.round(awa);
  $('target').textContent = toDisplay(state.targetSpeed) + ' kn';
}

// animation & drawing
function drawBoat(x,y,scale=1,angle=0){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(angle*Math.PI/180);
  // hull
  ctx.fillStyle = '#e9f8ff'; ctx.globalAlpha=0.14;
  ctx.beginPath(); ctx.ellipse(0,6,46*scale,14*scale,0,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(-42*scale,6*scale); ctx.quadraticCurveTo(0,-34*scale,42*scale,6*scale); ctx.fill();

  // mast
  ctx.strokeStyle='#f8f9fa'; ctx.lineWidth=3*scale;
  ctx.beginPath(); ctx.moveTo(0,-36*scale); ctx.lineTo(0,8*scale); ctx.stroke();

  // main sail (affected by mainTrim)
  const mTrim = state.mainTrim/100;
  ctx.fillStyle='rgba(255,209,102,0.95)';
  ctx.beginPath();
  ctx.moveTo(0,-34*scale);
  ctx.lineTo(28*scale + mTrim*18*scale, -6*scale);
  ctx.lineTo(0,-6*scale);
  ctx.closePath();
  ctx.fill();

  // jib (forward)
  const jTrim = state.jibTrim/100;
  ctx.fillStyle='rgba(255,230,180,0.95)';
  ctx.beginPath();
  ctx.moveTo(-18*scale,-4*scale);
  ctx.lineTo(10*scale + jTrim*12*scale, -2*scale);
  ctx.lineTo(-18*scale,14*scale);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function draw(){
  // clear & sea
  const w = canvas.width = canvas.clientWidth * devicePixelRatio;
  const h = canvas.height = canvas.clientHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);

  // gradient sea
  const grad = ctx.createLinearGradient(0,0,0,canvas.clientHeight);
  grad.addColorStop(0,'#073843'); grad.addColorStop(1,'#012a34');
  ctx.fillStyle=grad; ctx.fillRect(0,0,canvas.clientWidth,canvas.clientHeight);

  // simple waves
  for(let i=0;i<6;i++){
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.03 + i*0.02) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath();
    const amp = 4 + i*2;
    for(let x=0;x<canvas.clientWidth;x+=6){
      const y = 40 + i*18 + Math.sin((x/30) + (performance.now()/800) + i) * amp;
      ctx.lineTo(x,y);
    }
    ctx.stroke();
  }

  // draw wind vector indicator (top-left)
  ctx.save();
  ctx.translate(14,14);
  ctx.fillStyle='rgba(255,255,255,0.06)'; ctx.fillRect(-10,-10,110,44);
  ctx.fillStyle='#eaf6ff'; ctx.font='12px sans-serif'; ctx.fillText('Vent',0,0);
  // arrow
  const awa = clamp(state.trueWindAngle - state.helm*0.6,0,180);
  ctx.save(); ctx.translate(60,16);
  ctx.rotate((awa-90)*Math.PI/180);
  ctx.strokeStyle='#ffd166'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(-10,0); ctx.lineTo(18,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(12,-6); ctx.lineTo(18,0); ctx.lineTo(12,6); ctx.fillStyle='#ffd166'; ctx.fill();
  ctx.restore();
  ctx.restore();

  // draw boat center
  const bx = canvas.clientWidth/2;
  const by = canvas.clientHeight/2 + 30;
  drawBoat(bx,by, Math.min(canvas.clientWidth,400)/400, state.helm);

  // HUD text small
  ctx.fillStyle = 'rgba(234,246,255,0.85)';
  ctx.font = '12px sans-serif';
  ctx.fillText('Main: ' + state.mainTrim + '%   Jib: ' + state.jibTrim + '%', 12, canvas.clientHeight - 18);

  requestAnimationFrame(draw);
}

// loop
function loop(){
  if(state.running) compute();
  requestAnimationFrame(loop);
}

// initial
compute(); draw(); loop();

/* small usability: swipe left/right toggles true wind angle preset (mobile-friendly) */
let touchStartX=0, touchStartY=0;
canvas.addEventListener('touchstart', e=>{
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
});
canvas.addEventListener('touchend', e=>{
  const dx = (e.changedTouches[0].clientX - touchStartX);
  const dy = (e.changedTouches[0].clientY - touchStartY);
  if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){
    // horizontal swipe: adjust trueWindAngle
    state.trueWindAngle = clamp(state.trueWindAngle + (dx>0 ? -10 : 10), 0, 180);
    compute();
  }
});

/* Accessibility: keyboard shortcuts for desktop */
window.addEventListener('keydown', e=>{
  if(e.key === ' ') { state.running = !state.running; $('start').textContent = state.running ? 'Pause' : 'Lancer'; }
  if(e.key === 'r' || e.key === 'R') $('reset').click();
  if(e.key === 'ArrowUp') $('wind').value = Math.min(30, Number($('wind').value)+1), $('wind').dispatchEvent(new Event('input'));
  if(e.key === 'ArrowDown') $('wind').value = Math.max(0, Number($('wind').value)-1), $('wind').dispatchEvent(new Event('input'));
});
</script>
</body>
</html>
