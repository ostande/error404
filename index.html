<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Site en chantier</title>

  <!-- Google Font: Capriola -->
  <link href="https://fonts.googleapis.com/css2?family=Capriola&display=swap" rel="stylesheet">

  <style>
    :root{
      --accent-1: #FAE657; /* jaune */
      --accent-2: #0095D6; /* bleu */
      --bg: #0f1720;      /* fond sombre pour contraste élégant */
      --muted: rgba(255,255,255,0.7);
      --glass: rgba(255,255,255,0.04);
      --radius: 14px;
      --max-width: 980px;
      --gap: 24px;
      font-size: 16px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:'Capriola', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(180deg, #07101a 0%, #0f1720 100%);
      color: #fff;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px;
    }

    .card{
      width:100%;
      max-width:var(--max-width);
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
      border-radius:var(--radius);
      padding:calc(var(--gap) * 1.25);
      box-shadow: 0 8px 30px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
      display:flex;
      gap:var(--gap);
      align-items:center;
    }

    /* Left: logo / badge */
    .brand{
      flex: 0 0 88px;
      height:88px;
      border-radius:12px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      display:flex;
      align-items:center;
      justify-content:center;
      color:#07101a;
      font-weight:700;
      font-size:20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.45);
    }

    .content{
      flex:1;
      min-width:0;
    }

    .title{
      margin:0 0 6px 0;
      font-size: clamp(20px, 3.6vw, 34px);
      color: var(--accent-1);
      letter-spacing: 0.6px;
    }

    .subtitle{
      margin:0 0 12px 0;
      color:var(--muted);
      font-size: clamp(14px, 2.4vw, 16px);
    }

    .meta{
      display:flex;
      gap:12px;
      align-items:center;
      flex-wrap:wrap;
      margin-top:6px;
    }

    .pill{
      display:inline-flex;
      gap:8px;
      align-items:center;
      padding:8px 12px;
      border-radius:999px;
      background:var(--glass);
      color:var(--muted);
      font-size:13px;
      backdrop-filter: blur(6px);
    }

    .cta{
      margin-left:auto;
      display:flex;
      gap:10px;
      align-items:center;
    }

    .btn{
      border:0;
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
      font-weight:600;
      color:#07101a;
      background:var(--accent-1);
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    }

    .btn.secondary{
      background:transparent;
      color:var(--accent-1);
      border:1px solid rgba(255,255,255,0.06);
      box-shadow:none;
    }

    /* Right column: illustration / progress */
    .aside{
      width:220px;
      min-width:160px;
      display:flex;
      flex-direction:column;
      gap:12px;
      align-items:center;
    }

    .progress{
      width:100%;
      background: rgba(255,255,255,0.04);
      border-radius:999px;
      padding:6px;
    }

    .bar{
      width:46%;
      height:10px;
      border-radius:999px;
      background: linear-gradient(90deg,var(--accent-2), var(--accent-1));
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    }

    .eta{
      font-size:13px;
      color:var(--muted);
    }

    /* Mobile layout */
    @media (max-width:700px){
      body{padding:20px}
      .card{
        flex-direction:column;
        padding:18px;
        gap:14px;
      }
      .brand{width:72px;height:72px;font-size:18px}
      .aside{width:100%;flex-direction:row;justify-content:space-between;align-items:center}
      .cta{margin-left:0}
      .meta{margin-top:8px}
    }

  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="title">
    <div class="brand" aria-hidden="true">LOGO</div>

    <div class="content">
      <h1 id="title" class="title">Site en construction</h1>
      <p class="subtitle">Nous préparons quelque chose de spécial. Merci de votre patience — rendez-vous bientôt.</p>

      <div class="meta" aria-hidden="false">
        <span class="pill">🔧 En développement</span>
        <span class="pill">📅 Lancement estimé : Q3</span>

        <div class="cta" role="group" aria-label="Actions">
          <button class="btn" onclick="subscribe()">M'avertir</button>
          <button class="btn secondary" onclick="location.href='#'">Contact</button>
        </div>
      </div>
    </div>

    <aside class="aside" aria-hidden="false">
      <div style="text-align:center">
        <div class="progress" aria-hidden="true">
          <div class="bar"></div>
        </div>
        <div class="eta">46% terminé</div>
      </div>
    </aside>
  </main>

  <script>
    function subscribe(){
      const msg = 'Merci — vous serez notifié(e) (exemple).';
      if(window.confirm(msg)) {
        /* placeholder: intégrer formulaire / modal selon besoin */
      }
    }
  </script>
</body>
</html>
