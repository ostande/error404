<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Déso c'est pas là</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;900&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      overflow:hidden;
      font-family:'Poppins',sans-serif;
      background:linear-gradient(135deg,#0f0f0f,#1a0033,#000814);
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
      position:relative;
    }

    /* Glow background */
    .blob{
      position:absolute;
      width:400px;
      height:400px;
      border-radius:50%;
      filter:blur(120px);
      opacity:0.6;
      animation:float 10s infinite ease-in-out alternate;
    }

    .blob1{
      background:#8a2be2;
      top:-100px;
      left:-100px;
    }

    .blob2{
      background:#00d4ff;
      bottom:-120px;
      right:-100px;
      animation-delay:2s;
    }

    @keyframes float{
      from{
        transform:translateY(0px) translateX(0px);
      }
      to{
        transform:translateY(40px) translateX(30px);
      }
    }

    .card{
      position:relative;
      z-index:2;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.15);
      backdrop-filter:blur(15px);
      padding:60px 50px;
      border-radius:30px;
      text-align:center;
      box-shadow:0 0 40px rgba(0,0,0,0.4);
      animation:fadeIn 1.2s ease;
      max-width:700px;
      width:90%;
    }

    h1{
      font-size:4rem;
      font-weight:900;
      background:linear-gradient(90deg,#00d4ff,#ff00ff);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      margin-bottom:20px;
      text-shadow:0 0 20px rgba(255,255,255,0.2);
    }

    p{
      font-size:1.2rem;
      color:rgba(255,255,255,0.8);
      margin-bottom:35px;
    }

    .btn{
      display:inline-block;
      padding:15px 35px;
      border-radius:50px;
      text-decoration:none;
      color:white;
      font-weight:600;
      background:linear-gradient(90deg,#ff00ff,#00d4ff);
      transition:0.3s;
      box-shadow:0 0 20px rgba(0,212,255,0.5);
    }

    .btn:hover{
      transform:scale(1.08);
      box-shadow:0 0 35px rgba(255,0,255,0.8);
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    /* floating particles */
    .particle{
      position:absolute;
      width:6px;
      height:6px;
      background:white;
      border-radius:50%;
      opacity:0.5;
      animation:move 12s linear infinite;
    }

    @keyframes move{
      from{
        transform:translateY(100vh) scale(0);
      }
      to{
        transform:translateY(-10vh) scale(1);
      }
    }

  </style>
</head>
<body>

  <div class="blob blob1"></div>
  <div class="blob blob2"></div>

  <!-- particles -->
  <script>
    for(let i=0;i<40;i++){
      const p=document.createElement('div');
      p.classList.add('particle');
      p.style.left=Math.random()*100+'vw';
      p.style.animationDuration=(Math.random()*10+5)+'s';
      p.style.opacity=Math.random();
      p.style.width=p.style.height=(Math.random()*5+2)+'px';
      document.body.appendChild(p);
    }
  </script>

  <div class="card">
    <h1>déso c’est pas là 👀</h1>
    <p>
      T’as cliqué, t’as espéré… mais non 😭<br>
      Le vrai contenu arrive bientôt.
    </p>

    <a href="#" class="btn">Revenir plus tard</a>
  </div>

</body>
</html>
